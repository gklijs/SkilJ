[package]
name = "skilj-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
description = "The shared skilj side of the Kafka, AMQP and NATS bridges: consuming skilj's event stream over REST and recording or triggering from inbound messages."
keywords = ["event-sourcing", "messaging", "skilj"]
categories = ["network-programming"]

[lib]
name = "skilj_bridge"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
thiserror.workspace = true
sha2.workspace = true
chrono.workspace = true
skilj-retry.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
axum.workspace = true
tokio.workspace = true
