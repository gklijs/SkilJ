## CI - see docs/architecture.md §222/§223 and CONTRIBUTING.md for the checks
## themselves. Replaces the Woodpecker pipeline skilj ran on Codeberg.
##
## The Rust jobs run in `rust:1-bookworm`, as the Woodpecker steps did,
## so the scripts they call (scripts/ci-test.sh and the Postgres scripts
## behind it) see the same Debian container, running as root, that they
## were written against. The independent checks are separate jobs and run
## in parallel. Each test shard and the coverage job has its own database.
##
## Most Rust caches are saved on main and read by PRs. Semver is PR-only
## and saves a PR-scoped cache so subsequent updates can reuse it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Checks this file, including shellcheck on every `run:` block.
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  check-section-refs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test scripts/ci.test.mjs scripts/agent-guides/check.test.mjs scripts/bench/compare.test.mjs
      # Validates every "§N" citation of docs/architecture.md's own section
      # headings (a past renumbering silently broke ~600 of them).
      - run: scripts/check-section-refs.sh
      # skilj/agent-guides still describes the traits, names and paths this
      # workspace has (docs/architecture.md §248).
      - run: node scripts/agent-guides/check.mjs

  check-cga:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGA_TOOL_ROOT: ${{ github.workspace }}/.ci-cga-tool
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: cga-nightly-2026-10-18
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: CGA tool cache key
        id: cga-tool-key
        run: echo "key=$(node scripts/cga/check.mjs --tool-cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        id: cga-tool-cache
        with:
          path: .ci-cga-tool
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.cga-tool-key.outputs.key }}
      - name: Test CGA regression guard
        run: node --test scripts/cga/check.test.mjs
      - name: Check potential panic baseline
        run: node scripts/cga/check.mjs
      - uses: actions/cache/save@v5
        if: github.ref == 'refs/heads/main' && steps.cga-tool-cache.outputs.cache-hit != 'true'
        with:
          path: .ci-cga-tool
          key: ${{ steps.cga-tool-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cga-report
          path: target/cga-report/

  check-spec:
    runs-on: ubuntu-24.04
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # specs/skilj.allium is the source of truth for behavior. Fails on a
      # checker error, or on more warnings than the script accepts.
      - run: cargo install allium-cli --locked --version 3.5.3
      - run: scripts/check-spec.sh

  check-template:
    # On the bare runner, not in rust:1-bookworm: the script runs the
    # README's quickstart, and as a normal user (not root) skilj's local
    # mode downloads and starts its embedded Postgres, as it does for a
    # reader. In a root container it would use Debian's packaged server
    # instead, and test something else.
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare template at a stable path
        run: scripts/check-template.sh --prepare-only --cache-dir target/template-check
      # docs/architecture.md §249: the previous release's template, from its
      # tag, for the upgrade check below. The checkout has no tags.
      - name: Prepare the previous release
        run: |
          from="$(sed -n 's/^DEFAULT_FROM=//p' scripts/check-upgrade-pair.sh)"
          git fetch --no-tags --depth=1 origin "refs/tags/$from:refs/tags/$from"
          scripts/check-upgrade-pair.sh --prepare-only --cache-dir target/upgrade-pair
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            target/template-check/app -> ../build
            target/upgrade-pair/old -> ../old-build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Generates templates/skilj-template, builds it against this
      # workspace's crates - the template isn't a workspace member, so
      # nothing else notices when a change breaks it (docs/architecture.md §105) -
      # and runs the quickstart: deposit accepted, overdraft rejected.
      - run: scripts/check-template.sh --prepared --cache-dir target/template-check
      # The previous release on an empty database, this workspace upgrading
      # it with the previous release's data intact, and the previous release
      # then refusing the upgraded database - as separate processes, on one
      # embedded Postgres (docs/architecture.md §249). Before the agent-guide
      # solutions, which change the generated app this reuses.
      - run: >-
          scripts/check-upgrade-pair.sh --prepared --cache-dir target/upgrade-pair
          --new-cache target/template-check
      # What the template gives a coding agent: the guides are found, and
      # the reference solutions of their three evaluation tasks still pass
      # against this workspace (docs/architecture.md §248).
      - run: scripts/agent-guides/eval/check-solutions.sh --cache-dir target/template-check

  check-template-docker:
    # The template's Dockerfile, built the way a user builds it (amd64;
    # the file names no architecture, so arm64 differs only in the base
    # image's platform). The runner's own Docker daemon, hence no container.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: actions/cache/restore@v5
        id: docker-cache
        with:
          path: ${{ runner.temp }}/template-docker-cache
          key: ${{ runner.os }}-template-docker-v1-${{ github.sha }}
          restore-keys: ${{ runner.os }}-template-docker-v1-
      - name: Build and smoke-test the template image
        env:
          DOCKER_CACHE_HIT: ${{ steps.docker-cache.outputs.cache-hit }}
        run: |
          cache_args=()
          if [[ -f "$RUNNER_TEMP/template-docker-cache/index.json" ]]; then
            cache_args+=(--cache-from "type=local,src=$RUNNER_TEMP/template-docker-cache")
          fi
          if [[ "$GITHUB_REF" == refs/heads/main && "$DOCKER_CACHE_HIT" != true ]]; then
            cache_args+=(--cache-to "type=local,dest=$RUNNER_TEMP/template-docker-cache-new,mode=max")
          fi
          scripts/check-template-docker.sh "${cache_args[@]}"
      - name: Replace the exported layer cache
        if: github.ref == 'refs/heads/main' && steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf "$RUNNER_TEMP/template-docker-cache"
          mv "$RUNNER_TEMP/template-docker-cache-new" "$RUNNER_TEMP/template-docker-cache"
      - uses: actions/cache/save@v5
        if: github.ref == 'refs/heads/main' && steps.docker-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/template-docker-cache
          key: ${{ steps.docker-cache.outputs.cache-primary-key }}

  check-federation-composition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Composes the federation descriptions skilj publishes, as recorded
      # by skilj/tests/graphql_federation.rs, with Apollo's and Hive's
      # composition next to another subgraph (docs/architecture.md §194).
      - run: scripts/check-federation-composition.sh

  fmt:
    runs-on: ubuntu-24.04
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  deny:
    runs-on: ubuntu-24.04
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v5
      # RustSec advisories, licenses, banned crates and sources, per
      # deny.toml. A pinned release binary rather than `cargo install`,
      # which would compile cargo-deny itself on every run.
      - name: Download cargo-deny
        run: |
          curl --retry 4 --retry-delay 2 --retry-max-time 120 -sSfL \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz \
            -o /tmp/cargo-deny.tar.gz
          tar xzf /tmp/cargo-deny.tar.gz -C /tmp
      - run: /tmp/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny check

  semver:
    # Only on a pull request: the question is what this change does to the
    # public API of the library crates against what is published, and the
    # answer is only useful before a merge. A breaking change that is meant
    # (the crates are 0.x) shows up as a failure that asks for the minor
    # bump in the same diff.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    container: rust:1-bookworm
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      # libsasl2-dev: semver-checks builds every feature not named like
      # `unstable`, so skilj-kafka's `gssapi` (Kerberos, issue #124) too,
      # and its sasl2-sys links the system libsasl2.
      - run: apt-get update && apt-get install -y --no-install-recommends cmake libsasl2-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.51.0
      - uses: Swatinem/rust-cache@v2
        with:
          # This job is PR-only: cache within the PR for its next update.
          save-if: true
      # Every published crate with a library target, compared with its
      # latest release on crates.io: the ones the README's stability
      # promise names, and the internal ones a patch release must not
      # break either. `--workspace` skips `publish = false` crates
      # (skilj-demo, skilj-test-support) and binary-only ones (skilj-tui,
      # skilj-inspector), and a new crate is skipped until it has a
      # release to compare with. skilj-kafka is why this job installs
      # cmake: building its baseline compiles librdkafka.
      - run: cargo semver-checks --workspace

  machete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # A dependency nothing uses still has to be built, audited and
      # licensed. Reads the sources, so it needs no build.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete

  msrv:
    runs-on: ubuntu-24.04
    container: rust:1-bookworm
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      # The workspace's declared `rust-version` (Cargo.toml) must keep
      # building. Libraries and binaries only - what a dependent compiles;
      # the tests run on stable below.
      - run: apt-get update && apt-get install -y --no-install-recommends cmake
      - run: rustup toolchain install 1.95 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +1.95 check --workspace --lib --bins

  # Its own job, next to `test` rather than before it: neither needs the
  # other's output, since clippy and rustdoc build dependencies as
  # metadata only, which `cargo test` can't reuse anyway.
  clippy-doc:
    runs-on: ubuntu-24.04
    container: rust:1-bookworm
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      # rdkafka's build script still builds librdkafka under clippy.
      - run: apt-get update && apt-get install -y --no-install-recommends cmake
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # skilj-kafka's TLS (on by default, issue #124) and zstd build: the bundled
      # OpenSSL and libzstd are the ones with build requirements of their own.
      - run: cargo check -p skilj-kafka --features zstd
      # Broken intra-doc links and public docs linking to private items
      # don't fail a build, and docs.rs renders them as dead text.
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  test-suites:
    strategy:
      fail-fast: false
      matrix:
        group: [business, app, libraries]
    runs-on: ubuntu-24.04
    container:
      image: rust:1-bookworm
      # The runner's preinstalled SDKs, mounted so the first step can
      # delete them: the workspace's ~110 integration-test binaries ran a
      # CI disk full before (see CARGO_PROFILE_DEV_DEBUG below), and these
      # directories are most of the runner's used space.
      volumes:
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
        - /opt/hostedtoolcache/CodeQL:/host/codeql
    # The Postgres the tests run against. A service's name is its
    # hostname from inside a container job, and the health check makes
    # the job wait until it accepts connections.
    services:
      skilj-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Trust removes any client/server password mismatch, which is
          # invisible from the job's side. Safe for what this is: a
          # per-job container on a private network with no published
          # ports, holding throwaway test databases.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # ci-test.sh reads this to find the service; its credentials default
      # to postgres/postgres/postgres, which is also what the service gets.
      CI_TEST_GROUP: ${{ matrix.group }}
      CI_TEST_LOG: /tmp/test-output.log
      CI_POSTGRES_HOST: skilj-postgres
      # Disk, not speed: no run reuses the incremental cache, and line
      # tables keep file:line in panic backtraces while dropping the
      # variable/type debug info that is most of each binary's size.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
    steps:
      - name: Free runner disk space
        run: rm -rf /host/dotnet/* /host/android/* /host/ghc/* /host/codeql/* && df -h /
      - uses: actions/checkout@v5
      # cmake: skilj-kafka's rdkafka vendors librdkafka via cmake.
      # `postgresql` is the server: the
      # failover test (skilj_test_support::FailoverServer, docs/architecture.md
      # §176) runs a primary and a standby of its own, as the `postgres`
      # user this package creates, since Postgres refuses to run as root.
      - run: apt-get update && apt-get install -y --no-install-recommends cmake postgresql-client postgresql
      # Settle the database first, so a missing one shows in seconds
      # rather than after the whole workspace is built. Prefers the
      # service and falls back to a Postgres inside this container.
      - run: bash scripts/ci-test.sh --setup-only
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.group }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Compiles exactly what the run below needs, as its own step so a
      # compile error is told apart from a failing test. Not `cargo build
      # --all-targets`: `cargo test` recompiled the workspace crates after
      # it (1m43s on the first GitHub run).
      - run: bash scripts/ci-test.sh --build-only
      # Every Postgres-backed test runs against a real server, and the
      # broker suites against containers on the runner's Docker, which
      # this container job reaches through its mounted socket. ci-test.sh
      # fails the build if any test skipped anyway (§223).
      - run: bash scripts/ci-test.sh

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-${{ matrix.group }}-timings-and-log
          path: |
            /tmp/test-output.log
            target/cargo-timings/
          if-no-files-found: ignore

  postgres-compatibility:
    # Boundary versions only; the full suite above stays on Postgres 17.
    # No brokers or Temporal, and no fallback to Debian's installed server.
    strategy:
      fail-fast: false
      matrix:
        postgres: [15, 18]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: rust:1-bookworm
    services:
      skilj-postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI_TEST_GROUP: postgres
      CI_POSTGRES_MAJOR: ${{ matrix.postgres }}
      CI_POSTGRES_HOST: skilj-postgres
      CI_TEST_LOG: /tmp/postgres-compatibility.log
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update && apt-get install -y --no-install-recommends postgresql-client
      - run: bash scripts/ci-test.sh --setup-only
      - uses: Swatinem/rust-cache@v2
        with:
          key: postgres-compatibility
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.postgres == 15 }}
      - run: bash scripts/ci-test.sh --build-only
      - run: bash scripts/ci-test.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: postgres-${{ matrix.postgres }}-timings-and-log
          path: |
            /tmp/postgres-compatibility.log
            target/cargo-timings/
          if-no-files-found: ignore

  # Keep the required check name; shards and compatibility jobs must all pass.
  test:
    if: always()
    needs: [test-suites, postgres-compatibility]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every test shard and Postgres boundary version
        env:
          RESULT: ${{ needs.test-suites.result }}
          POSTGRES_RESULT: ${{ needs.postgres-compatibility.result }}
        run: test "$RESULT" = success && test "$POSTGRES_RESULT" = success

  # Line coverage of the same run as `test`, reported in the job summary
  # and attached as lcov. Informational: it never fails the build, and
  # there is no threshold until there is a baseline to hold.
  coverage:
    # Instrumented builds run separately on main and on explicit dispatch.
    # Every PR still runs the full uninstrumented suite through test-suites.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    continue-on-error: true
    container:
      image: rust:1-bookworm
      # The runner's preinstalled SDKs, mounted so the first step can
      # delete them: the workspace's ~110 integration-test binaries ran a
      # CI disk full before (see CARGO_PROFILE_DEV_DEBUG below), and these
      # directories are most of the runner's used space.
      volumes:
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
        - /opt/hostedtoolcache/CodeQL:/host/codeql
    # The Postgres the tests run against. A service's name is its
    # hostname from inside a container job, and the health check makes
    # the job wait until it accepts connections.
    services:
      skilj-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Trust removes any client/server password mismatch, which is
          # invisible from the job's side. Safe for what this is: a
          # per-job container on a private network with no published
          # ports, holding throwaway test databases.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # ci-test.sh reads this to find the service; its credentials default
      # to postgres/postgres/postgres, which is also what the service gets.
      CI_POSTGRES_HOST: skilj-postgres
      # Disk, not speed: no run reuses the incremental cache, and line
      # tables keep file:line in panic backtraces while dropping the
      # variable/type debug info that is most of each binary's size.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
    steps:
      - name: Free runner disk space
        run: rm -rf /host/dotnet/* /host/android/* /host/ghc/* /host/codeql/* && df -h /
      - uses: actions/checkout@v5
      # cmake: skilj-kafka's rdkafka vendors librdkafka via cmake.
      # `postgresql` is the server: the
      # failover test (skilj_test_support::FailoverServer, docs/architecture.md
      # §176) runs a primary and a standby of its own, as the `postgres`
      # user this package creates, since Postgres refuses to run as root.
      - run: apt-get update && apt-get install -y --no-install-recommends cmake postgresql-client postgresql
      # Settle the database first, so a missing one shows in seconds
      # rather than after the whole workspace is built. Prefers the
      # service and falls back to a Postgres inside this container.
      - run: bash scripts/ci-test.sh --setup-only
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.6.16
      - run: rustup component add llvm-tools-preview
      - name: Test with coverage
        env:
          CI_CARGO_TEST: cargo llvm-cov --no-report
        run: bash scripts/ci-test.sh
      - name: Report
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          {
            echo '### Line coverage'
            echo '```'
            cargo llvm-cov report --summary-only --ignore-filename-regex '(/tests/|skilj-demo|skilj-test)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: lcov
          path: lcov.info
