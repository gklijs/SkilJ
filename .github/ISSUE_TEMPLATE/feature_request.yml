name: Feature request
description: Something skilj doesn't do yet, or could do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and where skilj gets in the way or falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you'd want it to work - an API sketch, a GraphQL/REST shape, or a description.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you use today, or other designs you weighed.
