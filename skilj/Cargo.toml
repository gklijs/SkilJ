[package]
name = "skilj"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SkilJ: a Rust library for building event-sourced, DDD-style applications backed by Postgres, exposing a GraphQL surface and a REST surface. A thin facade over skilj-core/skilj-graphql/skilj-rest - see docs/architecture.md §3.1."

[dependencies]
skilj-core.workspace = true
skilj-graphql.workspace = true
skilj-rest.workspace = true
tokio.workspace = true
axum.workspace = true
chrono.workspace = true
schemars.workspace = true
serde_json.workspace = true

[dev-dependencies]
postgresql_embedded = "0.21.0"
serde.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
jsonwebtoken.workspace = true
