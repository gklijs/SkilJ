[package]
name = "skilj"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
description = "SkilJ: a Rust library for building event-sourced, DDD-style applications backed by Postgres, exposing a GraphQL surface and a REST surface. A thin facade over skilj-core/skilj-graphql/skilj-rest - see docs/architecture.md §3.1."

[dependencies]
skilj-core.workspace = true
skilj-graphql.workspace = true
skilj-rest.workspace = true
skilj-macros.workspace = true
tokio.workspace = true
axum.workspace = true
chrono.workspace = true
schemars.workspace = true
serde_json.workspace = true
# `SkiljBuilder::auto_register()`'s own collection mechanism - see
# `skilj_macros::auto_register`'s doc comment. Re-exported (`pub use
# inventory;` in src/lib.rs) so a consuming crate's `#[auto_register]`
# expansion resolves `::skilj::inventory::submit!` off its existing
# `skilj` dependency alone, without adding this crate directly.
inventory = "0.3"
tracing.workspace = true
opentelemetry.workspace = true
# Codeberg issue #15: bounded concurrent fan-out over per-bounded-context
# work in SkiljBuilder::build()'s startup warm-up and the background
# pollers (buffer_unordered) - was previously only a dev-dependency
# (used in skilj/tests/ for WebSocket stream handling), promoted to a
# real dependency now that src/lib.rs uses it too.
futures-util.workspace = true
# Codeberg issue #13: TemplateCache's own live, cross-instance-refreshed
# `bounded_context -> template` lookup - same `ArcSwap`-behind-a-cheap-
# `Arc` pattern `skilj_graphql::schema::SchemaRegistry` already uses for
# an identical reason (a request in flight keeps reading a consistent
# snapshot while a rebuild swaps in a new one, no lock held across it).
arc-swap.workspace = true

[dev-dependencies]
postgresql_embedded = "0.21.0"
serde.workspace = true
tracing-subscriber.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
jsonwebtoken.workspace = true
tokio-tungstenite.workspace = true
