[package]
name = "skilj-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
description = "A Ratatui operator console for any skilj deployment - a GraphQL client, independent of every other skilj crate. See docs/architecture.md §11."

[dependencies]
tokio = { workspace = true }
ratatui.workspace = true
crossterm.workspace = true
clap.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true

[dev-dependencies]
# `ws` isn't one of axum's own default features - needed for the mock
# websocket server `tests/subscription.rs` drives.
axum = { workspace = true, features = ["ws"] }

[[bin]]
name = "skilj-tui"
path = "src/main.rs"
