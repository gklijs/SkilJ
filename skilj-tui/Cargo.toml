[package]
name = "skilj-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
description = "A terminal console for any skilj deployment over GraphQL: browse events and projections, submit commands, handle parked deliveries."
keywords = ["event-sourcing", "tui", "ratatui", "graphql", "skilj"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { workspace = true }
ratatui.workspace = true
crossterm.workspace = true
clap.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true

[dev-dependencies]
# `ws` isn't one of axum's own default features - needed for the mock
# websocket server `tests/subscription.rs` drives.
axum = { workspace = true, features = ["ws"] }

[[bin]]
name = "skilj-tui"
path = "src/main.rs"
