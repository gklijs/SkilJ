[package]
name = "skilj-inspector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
description = "A read-only terminal console that reads a skilj database directly, for browsing events, types and projection state when the server isn't running."
keywords = ["event-sourcing", "tui", "ratatui", "postgres", "skilj"]
categories = ["command-line-utilities", "database"]

[dependencies]
skilj-core.workspace = true
tokio.workspace = true
ratatui.workspace = true
crossterm.workspace = true
clap.workspace = true
chrono.workspace = true

[dev-dependencies]
skilj-test-support = { path = "../skilj-test-support" }
serde_json.workspace = true

[[bin]]
name = "skilj-inspector"
path = "src/main.rs"
