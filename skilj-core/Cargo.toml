[package]
name = "skilj-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
description = "SkilJ's domain engine: entities, rules, the plugin API, and persistence. Zero web-framework dependency - see docs/architecture.md §3."

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
sqlx.workspace = true
chrono.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
uuid.workspace = true
ring.workspace = true
base64.workspace = true
skilj-macros.workspace = true
cron = "0.17.0"
tracing.workspace = true
# API-only - records measurements through `opentelemetry::global::meter(...)`.
# No SDK/exporter dependency here; see docs/architecture.md's tracing
# section for the crate boundary.
opentelemetry.workspace = true
# `default-features = false` - the resolve-file/resolve-http/reqwest/tls
# features are all about following remote/local $ref URIs a schema might
# reference; every schema this crate ever validates is one bounded
# context's own opaque, self-contained JSON Schema string (see the
# "Payload schema shape" note in specs/skilj.allium), so none of that
# applies.
jsonschema = { version = "0.49.9", default-features = false }
ipnet.workspace = true

[dev-dependencies]
postgresql_embedded = "0.21.0"
proptest.workspace = true
# Only to serve a real JWKS document from a real local HTTP server in
# access_control's own JWT-verification tests - skilj-core stays zero
# web-framework dependency for real, non-test, use (docs/architecture.md
# §3.2) since this is dev-only.
axum.workspace = true
# Only to build a small in-process span-capturing `Layer` for the
# tracing tests below - no subscriber is ever installed by non-test
# code, per the crate's own "emit via `tracing` only" boundary.
tracing-subscriber.workspace = true
# `testing` feature only, for the in-process metrics exporter
# (`opentelemetry_sdk::metrics::InMemoryMetricExporter`) the metrics
# test uses instead of a real OTLP collector.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
