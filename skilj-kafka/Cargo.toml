[package]
name = "skilj-kafka"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
description = "A bridge between skilj and Kafka: publishes skilj events to topics, and turns consumed messages into skilj events or commands."
keywords = ["kafka", "event-sourcing", "messaging", "cqrs", "skilj"]
categories = ["network-programming"]

[dependencies]
tokio.workspace = true
futures-util.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tracing.workspace = true
thiserror.workspace = true
chrono.workspace = true
# issue #21 - the shared backoff/attempt-cap policy both
# directions now apply: bounded (park-on-exhaustion) inbound, unbounded
# (skip-on-exhaustion, if a cap is configured at all) outbound. See
# docs/architecture.md's parked-deliveries section.
skilj-retry.workspace = true
# The skilj REST client side every bridge shares (docs/architecture.md §165).
skilj-bridge.workspace = true
# cmake-build: vendors and compiles librdkafka from source rather than
# needing it (and its -dev headers) present on the system - see
# CONTRIBUTING.md's own note on the one real build-time snag this hits
# (an unconditional `#include <curl/curl.h>` in this librdkafka version,
# regardless of WITH_CURL).
rdkafka = { version = "0.39", features = ["cmake-build", "tokio"] }

# Pass-throughs to rdkafka's own features (GitHub issue #124). TLS is on
# by default because most managed Kafka requires it, and it is the
# vendored OpenSSL, linked statically, so the binary still runs in a
# `FROM scratch` image. Build with `default-features = false` to drop it
# (no OpenSSL, perl or make needed; `SSL`/`SASL_SSL` then fail at client
# creation), or `default-features = false, features = ["ssl"]` to link
# the system OpenSSL instead.
[features]
default = ["ssl-vendored"]
# `security.protocol=SSL` / `SASL_SSL` and `SCRAM-SHA-*`, linking the
# system OpenSSL dynamically.
ssl = ["rdkafka/ssl"]
# The same, building OpenSSL from source and linking it statically (needs
# a C compiler, perl and make).
ssl-vendored = ["rdkafka/ssl-vendored"]
# Kerberos (`sasl.mechanism=GSSAPI`).
gssapi = ["rdkafka/gssapi"]
# `compression.type=zstd`.
zstd = ["rdkafka/zstd"]

[lib]
name = "skilj_kafka"
path = "src/lib.rs"

[dev-dependencies]
# Dev-only: proves this crate's Kafka calls against a real, ephemeral
# Kafka broker (KRaft mode, no ZooKeeper) - never a production
# dependency of skilj-kafka itself, the same "wire protocol only, real
# external system in tests, mocked skilj in tests" treatment
# skilj-temporal's own real-Temporal-service test already uses. See
# CONTRIBUTING.md's own note on the DOCKER_HOST quirk this needs
# working around on WSL.
testcontainers-modules = { version = "0.15", features = ["kafka"] }
skilj-test-support = { path = "../skilj-test-support" }
axum = { workspace = true }
