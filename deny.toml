# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/),
# run in CI (.woodpecker.yml's `deny` step) and by hand with
# `cargo deny check`.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check, unmaintained-crate notices
# included for crates this workspace depends on directly. An advisory that
# does not apply goes in `ignore` with the reason.
unmaintained = "workspace"
ignore = []

[licenses]
# skilj is MIT OR Apache-2.0; every dependency's license must allow
# distributing it under that.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MIT-0",
    # postgresql_embedded (the `local` feature and the test fallback).
    "PostgreSQL",
    # webpki-roots/webpki-root-certs: Mozilla's root certificate data.
    "CDLA-Permissive-2.0",
    # File-level copyleft (ascii_utils/fast_chemail via jsonschema's email
    # format, option-ext via dirs): applies to changes to those crates' own
    # files, not to code that merely links them.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside this workspace carry no version on unpublished
# crates (skilj-test-support); those are not wildcards to crates.io.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
