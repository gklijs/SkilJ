[package]
name = "{{project-name}}"
version = "0.1.1"
edition = "2021"

[features]
# Without DATABASE_URL, `cargo run --bin server` starts an embedded Postgres
# of its own (skilj's single-user local mode). The Dockerfile builds without
# it, since a container is always given a DATABASE_URL.
default = ["local"]
local = ["skilj/local"]

[dependencies]
skilj = "0.1.1"
skilj-core = "0.1.1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04"] }
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "server"
path = "src/bin/server.rs"
