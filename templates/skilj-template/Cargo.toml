[package]
name = "{{project-name}}"
version = "0.4.0"
edition = "2021"

[features]
# Without DATABASE_URL, `cargo run --bin server` starts an embedded Postgres
# of its own (skilj's single-user local mode). The Dockerfile builds without
# it, since a container is always given a DATABASE_URL.
default = ["local"]
local = ["skilj/local"]

[dependencies]
skilj = "0.5.0"
skilj-core = "0.5.0"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["jiff02"] }
jiff = { version = "0.2.46", features = ["serde"] }

[dev-dependencies]
skilj-test-fixture = "0.5.0"

[package.metadata.cargo-machete]
# jiff, and schemars's `jiff02` feature above, are for the date fields a project adds.
ignored = ["jiff"]

[[bin]]
name = "server"
path = "src/bin/server.rs"
