[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2021"

[dependencies]
skilj = "0.0.5"
skilj-core = "0.0.5"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["chrono"] }
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "server"
path = "src/bin/server.rs"
