## Codeberg-hosted CI - see docs/architecture.md and CONTRIBUTING.md for
## the checks themselves. A Forgejo Actions pipeline was considered
## first but needs a self-hosted runner Codeberg doesn't provide out of
## the box, so this Woodpecker config (Codeberg's own first-class hosted
## CI - see https://docs.codeberg.org/ci/) is what actually runs, and
## the only pipeline definition in this repo.
##
## Must be enabled once per repo at https://ci.codeberg.org/repos/add
## before it starts building - adding this file alone doesn't register
## a webhook.
##
## Each step below runs in its own fresh container - only the workspace
## (the checked-out repo, including `target/`) is shared across steps,
## never anything installed into a container's own system dirs. That's
## why `apt-get install libcurl4-openssl-dev`/`rustup component add`
## live inside the one step that needs them rather than as their own
## separate steps the way `.forgejo/workflows/ci.yml` has them (that
## file's steps all share one long-lived container instead, so the
## same split works there but would silently break here).

when:
  - event: push
    branch: main
  - event: pull_request
  # Without this, Woodpecker's own "Run pipeline" UI button creates a
  # pipeline with event: manual, which matches neither entry above -
  # surfaced as a bare "no matching workflows found", not an error tied
  # to this file at all.
  - event: manual

steps:
  - name: check-section-refs
    image: rust:1-bookworm
    commands:
      # Validates every "§N" citation of docs/architecture.md's own
      # section headings - see that script's own doc comment for why
      # this exists (a past renumbering silently broke ~600 of them).
      - scripts/check-section-refs.sh

  - name: fmt
    image: rust:1-bookworm
    commands:
      - rustup component add rustfmt
      - cargo fmt --all -- --check

  - name: build-clippy-test
    image: rust:1-bookworm
    commands:
      # skilj-kafka's rdkafka dependency vendors librdkafka from source
      # via the cmake-build feature - `rust:1-bookworm` has a C compiler
      # but no `cmake` itself, unlike a typical dev machine where it's
      # already present for other reasons (CONTRIBUTING.md's own note
      # only had to call out the libcurl one below, since cmake was
      # never the missing piece there). Separately, that vendored
      # librdkafka #includes curl/curl.h unconditionally even with CURL
      # support compiled out - a real upstream quirk, not something this
      # crate's own Cargo features avoid - hence libcurl4-openssl-dev
      # too. (skilj-temporal no longer needs a system protoc as of
      # 0.0.5 - it builds via temporalio-client's own vendored-protox
      # feature instead.)
      - apt-get update && apt-get install -y --no-install-recommends cmake libcurl4-openssl-dev
      - rustup component add clippy
      - cargo build --workspace --all-targets
      - cargo clippy --workspace --all-targets -- -D warnings
      # This container has no DATABASE_URL/Postgres service, so every
      # Postgres-backed test falls onto its own `postgresql_embedded`
      # fallback (see e.g. skilj-core/tests/persistence.rs's own doc
      # comment) - and that fallback is designed to self-skip with a
      # "skipping: ..." stderr note, not fail, when it can't reach a
      # database at all. That's the right call for a contributor's own
      # sandboxed machine, but it means a broken embedded-Postgres
      # download/start in *this* container (missing libxml2, no egress,
      # ...) would silently turn every persistence test into a no-op
      # while `cargo test` still exits 0 - discovered locally the hard
      # way (docs/architecture.md's own dep-bump/panic-fix passes hit
      # this exact trap under WSL). Capture the output and fail loudly
      # if that ever happens here, instead of trusting a green build.
      # Only the Postgres-flavoured skip messages are checked, not every
      # "skipping: ..." line: this container also has no Docker daemon,
      # so the Kafka/AMQP/NATS/Temporal bridge tests skip on every CI
      # run today too (a separate, pre-existing, already-accepted gap in
      # CI's own coverage, not something to newly fail the build over -
      # see CONTRIBUTING.md's own DOCKER_HOST note). Every Postgres skip
      # site, direct or through the shared connect_and_migrate/
      # check_reachable helpers, always names its source as either
      # "embedded PostgreSQL" or "DATABASE_URL" (grep the workspace for
      # `eprintln!("skipping:` to confirm before narrowing this further).
      #
      # `--nocapture` is what makes this check work at all: the skip note
      # is printed from inside a test that then passes, and libtest
      # swallows a passing test's output - without it, a run where every
      # Postgres test skipped logged no "skipping:" line and this grep
      # could never match (reproduced with an unreachable DATABASE_URL:
      # 59 "passing" persistence tests, zero matches). Not anchored with
      # `^` for the same reason: with tests running in parallel, a note
      # can land mid-line after another test's own `test ... ` prefix.
      - cargo test --workspace -- --nocapture > /tmp/test-output.log 2>&1 || test_exit=$?
      - cat /tmp/test-output.log
      - |
        if grep -qE 'skipping:.*(DATABASE_URL|PostgreSQL)' /tmp/test-output.log; then
          echo "ERROR: one or more Postgres-backed tests silently skipped (see the 'skipping: ...' lines above) instead of running - CI must never report green without actually exercising the persistence layer." >&2
          exit 1
        fi
      - test "${test_exit:-0}" -eq 0
