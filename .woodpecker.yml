## Codeberg-hosted CI - see docs/architecture.md and CONTRIBUTING.md for
## the checks themselves. A Forgejo Actions pipeline was considered
## first but needs a self-hosted runner Codeberg doesn't provide out of
## the box, so this Woodpecker config (Codeberg's own first-class hosted
## CI - see https://docs.codeberg.org/ci/) is what actually runs, and
## the only pipeline definition in this repo.
##
## Must be enabled once per repo at https://ci.codeberg.org/repos/add
## before it starts building - adding this file alone doesn't register
## a webhook.
##
## Each step below runs in its own fresh container - only the workspace
## (the checked-out repo, including `target/`) is shared across steps,
## never anything installed into a container's own system dirs. That's
## why `apt-get install libcurl4-openssl-dev`/`rustup component add`
## live inside the one step that needs them rather than as their own
## separate steps the way `.forgejo/workflows/ci.yml` has them (that
## file's steps all share one long-lived container instead, so the
## same split works there but would silently break here).
##
## `services:` is workflow-level, not step-level (see the block below for
## why that is worth stating in a file where it was got wrong for a long
## time). One consequence to know before adding a service: Woodpecker
## starts it once for the pipeline, not once per step, and it runs for
## the whole pipeline - so the other four steps have a database sitting
## next to them that they never touch. That is the cost of the only
## mechanism this CI has for a real database, and it is cheaper than it
## looks: one idle container, not four.

when:
  - event: push
    branch: main
  - event: pull_request
  # Without this, Woodpecker's own "Run pipeline" UI button creates a
  # pipeline with event: manual, which matches neither entry above -
  # surfaced as a bare "no matching workflows found", not an error tied
  # to this file at all.
  - event: manual

## A `services:` container is how a step gets a real database, and the
## service's name is its hostname - which is the whole reason this block
## sits at the workflow's top level rather than under the step that uses
## it. It was nested under the step for its whole life, which is Drone's
## shape and not Woodpecker's: `services` is workflow-level here and the
## step object has no such property
## (`pipeline/frontend/yaml/types.Container`), so Woodpecker's linter
## flagged every run of this file with "Additional property services is
## not allowed". A linter finding does not fail a step - it just left the
## pipeline with no service container at all, and five diagnosis rounds
## chased a credential problem that was a misplaced key. Hence the
## `check-woodpecker-config` step below, which makes that class of error
## blocking.
services:
  - name: skilj-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Load-bearing, not laziness: the client and the server are two
      # separate configurations that the step cannot see the server half
      # of, and a password mismatch between them is invisible from the
      # step's side and unfixable from it. Trust removes the class of
      # problem - whatever the client sends, this server accepts. Safe
      # because of what this container is: a per-pipeline service on a
      # private network, no published ports, no life beyond the pipeline,
      # holding throwaway test databases. Not a setting to copy into
      # anything reachable.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: postgres

steps:
  - name: check-woodpecker-config
    image: rust:1-bookworm
    commands:
      # Validates this file against Woodpecker's own published JSON
      # schema - the one its linter uses. Woodpecker reports schema
      # problems as a warning that does *not* fail a step, so a misplaced
      # `services:` key sat here unnoticed for five CI runs while the
      # pipeline quietly ran with no database at all. This makes it
      # blocking (scripts/check-woodpecker-config.sh).
      - apt-get update && apt-get install -y --no-install-recommends python3-yaml python3-jsonschema
      - scripts/check-woodpecker-config.sh

  - name: check-section-refs
    image: rust:1-bookworm
    commands:
      # Validates every "§N" citation of docs/architecture.md's own
      # section headings - see that script's own doc comment for why
      # this exists (a past renumbering silently broke ~600 of them).
      - scripts/check-section-refs.sh

  - name: check-template
    image: rust:1-bookworm
    commands:
      # Generates templates/skilj-template and builds it against this
      # workspace's crates - the template isn't a workspace member, so
      # nothing else notices when a change breaks it
      # (docs/architecture.md §105).
      - scripts/check-template.sh

  - name: check-federation-composition
    image: node:22-bookworm-slim
    commands:
      # Composes the federation descriptions skilj publishes, as recorded
      # by skilj/tests/graphql_federation.rs, with Apollo's and Hive's
      # composition next to another subgraph (docs/architecture.md §194).
      - scripts/check-federation-composition.sh

  - name: fmt
    image: rust:1-bookworm
    commands:
      - rustup component add rustfmt
      - cargo fmt --all -- --check

  - name: build-clippy-test
    image: rust:1-bookworm
    # The Postgres the tests below run against, and the reason CI can
    # actually exercise the persistence layer at all. This step used to
    # run with no database of any kind, leaving every Postgres-backed
    # test to its `postgresql_embedded` fallback - which self-skips with
    # a "skipping: ..." note rather than failing, so a container that
    # couldn't download and initdb that fallback still reported a green
    # build. The step gets its database from this workflow's `services:`
    # container (declared at the top of this file, not here - see there).
    environment:
      # The service's name is its hostname, and ci-test.sh reads this to
      # find it. Its credentials default to postgres/postgres/postgres,
      # which is also what the service is given.
      CI_POSTGRES_HOST: skilj-postgres
      # Disk, not speed: 110 integration-test binaries, each linking most
      # of the workspace, filled the runner's disk ("No space left on
      # device" linking subject_erasure). No run reuses the incremental
      # cache, and line tables keep file:line in panic backtraces while
      # dropping the variable/type debug info that is most of each
      # binary's size.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
    commands:
      # skilj-kafka's rdkafka dependency vendors librdkafka from source
      # via the cmake-build feature - `rust:1-bookworm` has a C compiler
      # but no `cmake` itself, unlike a typical dev machine where it's
      # already present for other reasons (CONTRIBUTING.md's own note
      # only had to call out the libcurl one below, since cmake was
      # never the missing piece there). Separately, that vendored
      # librdkafka #includes curl/curl.h unconditionally even with CURL
      # support compiled out - a real upstream quirk, not something this
      # crate's own Cargo features avoid - hence libcurl4-openssl-dev
      # too. (skilj-temporal no longer needs a system protoc as of
      # 0.0.5 - it builds via temporalio-client's own vendored-protox
      # feature instead.) `postgresql` is the server: the failover test
      # (skilj_test_support::FailoverServer, docs/architecture.md §176)
      # runs a primary and a standby of its own, and Postgres refuses to
      # run as root, so as root it runs the system's binaries as the
      # `postgres` user this package creates - the embedded ones live in
      # root's home, out of that user's reach.
      - apt-get update && apt-get install -y --no-install-recommends cmake libcurl4-openssl-dev postgresql-client postgresql
      # Settle the database first, not last. Everything below this is
      # minutes of compiling, and a `services:` container comes with no
      # readiness signal: if it never comes up, the run should say so in
      # seconds rather than after the whole workspace is built. The
      # script prefers this step's service container and falls back to a
      # Postgres inside the step itself, so an unreachable service is a
      # loud note in the log rather than a red pipeline - see
      # scripts/ci-wait-for-postgres.sh, scripts/ci-postgres-local.sh
      # and scripts/ci-test.sh for what each path does and prints.
      - bash scripts/ci-test.sh --setup-only
      - rustup component add clippy
      - cargo build --workspace --all-targets
      - cargo clippy --workspace --all-targets -- -D warnings
      # Broken intra-doc links and public docs linking to private items
      # don't fail a build, and docs.rs renders them as dead text. Here
      # rather than in its own step: documenting skilj-kafka runs
      # rdkafka's build script, which needs the packages above.
      - RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      # Same setup, then the run: every Postgres-backed test now runs
      # against a real server rather than falling back to an embedded one,
      # and ci-test.sh fails the build if any of them skipped anyway - so
      # a server that came up unusable surfaces as a red build instead of
      # a green one that tested nothing.
      - bash scripts/ci-test.sh
