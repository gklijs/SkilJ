[package]
name = "skilj-rest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
description = "skilj's REST API: token-authenticated routes for services, agents and automated callers. Internal: use it through the skilj crate."
keywords = ["event-sourcing", "rest", "dcb", "http", "skilj"]
categories = ["web-programming::http-server"]

[dependencies]
skilj-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
chrono.workspace = true
tracing.workspace = true
opentelemetry.workspace = true
opentelemetry-http.workspace = true
tracing-opentelemetry.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
sqlx.workspace = true
tower = { version = "0.5", features = ["util"] }
# `testing` feature only, for the in-process span exporter
# (`opentelemetry_sdk::testing::trace`) the tracing-middleware test uses
# instead of a real OTLP collector.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
