[package]
name = "skilj-rest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SkilJ's REST surface: narrowly-scoped AccessToken-authenticated routes for agents and automated callers. See docs/architecture.md §7."

[dependencies]
skilj-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
axum-extra.workspace = true
chrono.workspace = true
tracing.workspace = true
opentelemetry.workspace = true
opentelemetry-http.workspace = true
tracing-opentelemetry.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
sqlx.workspace = true
tower = { version = "0.5", features = ["util"] }
# `testing` feature only, for the in-process span exporter
# (`opentelemetry_sdk::testing::trace`) the tracing-middleware test uses
# instead of a real OTLP collector.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
