[package]
name = "skilj-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Worked example built on `skilj`: two bounded contexts (banking, courses) showing what the dynamic consistency boundary buys over classic per-aggregate event sourcing. Not part of the library - see src/lib.rs."
publish = false

[dependencies]
skilj.workspace = true
skilj-core.workspace = true
tokio.workspace = true
axum.workspace = true
chrono.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-appender-tracing.workspace = true
# Only for `server.rs`'s own local JWKS/IdP shortcut - signs a demo JWT
# with a fixed test keypair so `cargo run` has *some* GraphQL-usable
# Role credential out of the box. See that file's own doc comment.
jsonwebtoken.workspace = true

[build-dependencies]
# Codeberg issue #5's narrower cut (docs/architecture.md §17) -
# banking.rs's own event/command shape is generated from
# src/banking.skilj.toml at build time; see build.rs. A build-only
# dependency, never linked into the running binary itself.
skilj-codegen.workspace = true

[dev-dependencies]
skilj-test-support = { path = "../skilj-test-support" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
skilj-test-fixture.workspace = true
# tests/snapshot.rs's own tampered-row proof needs a raw UPDATE against
# {schema}.snapshots directly - not otherwise a dependency this crate's
# own code needs.
sqlx.workspace = true

[[bin]]
name = "server"
path = "src/bin/server.rs"
