[package]
name = "skilj-temporal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "A bridge between skilj and Temporal: starts or signals workflow executions from skilj events, correlated by their DCB tags."
keywords = ["temporal", "workflow", "saga", "event-sourcing", "skilj"]
categories = ["asynchronous"]

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tracing.workspace = true
thiserror.workspace = true
skilj-retry.workspace = true
# The consume/ack and HTTP client side the bridges share (docs/architecture.md §165).
skilj-bridge.workspace = true
temporalio-client = { version = "1.0.0", features = ["vendored-protox"] }
temporalio-common = "1.0.0"

[lib]
name = "skilj_temporal"
path = "src/lib.rs"

[dev-dependencies]
# Dev-only: proves this crate's Temporal calls against a real ephemeral
# Temporal service - never a production dependency of skilj-temporal
# itself (which speaks only `temporalio-client`, the thin gRPC client -
# see docs/architecture.md §34's own note on why `temporalio-sdk`, the
# worker/Activity-authoring crate, is deliberately not depended on). The
# test downloads and launches that service itself rather than through
# `temporalio-sdk-core`'s `ephemeral-server` feature: that feature's
# `zip = "^8.4"` dependency can no longer be resolved, because crates.io
# yanked every `zip` release before 9.0.3 (three HIGH archive-extraction
# advisories, Oct 2026) and no fixed 8.x exists. See
# `tests/temporal_bridge.rs`'s own `start_temporal`.
axum = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
# The Unix test-server archive is a `.tar.gz`.
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dev-dependencies]
# The Windows test-server archive is a `.zip`; 9.x is the fixed line (the
# yanked 8.x line is exactly what this crate no longer depends on).
zip = { version = "9", default-features = false, features = ["deflate"] }
