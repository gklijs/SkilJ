name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-lint:
    runs-on: docker
    container:
      image: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Install protoc
        # skilj-temporal needs this at build time - one of its
        # dependencies (prost-wkt-types, via temporalio-client) generates
        # Rust from .proto files in its own build script and doesn't
        # vendor protoc itself. See CONTRIBUTING.md's own note.
        run: apt-get update && apt-get install -y --no-install-recommends protobuf-compiler

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace
