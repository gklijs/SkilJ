name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-lint:
    runs-on: docker
    container:
      image: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Check §-section references against docs/architecture.md
        run: scripts/check-section-refs.sh

      - name: Cache cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Install libcurl headers
        # skilj-kafka's rdkafka dependency vendors librdkafka from source
        # (cmake-build), which #includes curl/curl.h unconditionally even
        # with CURL support compiled out - a real upstream quirk, not
        # something this crate's own Cargo features avoid. See
        # CONTRIBUTING.md's own note. (skilj-temporal no longer needs a
        # system protoc as of 0.0.5 - it builds via temporalio-client's
        # own vendored-protox feature instead.)
        run: apt-get update && apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace
